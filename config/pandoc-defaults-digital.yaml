# Pandoc Defaults for Constellize Book
# PDF/X-1a Book Production Settings

# Input/Output
from: markdown+smart+yaml_metadata_block+fenced_code_blocks+backtick_code_blocks+pipe_tables+grid_tables+simple_tables+multiline_tables+footnotes+inline_notes+citations+raw_html+markdown_in_html_blocks+native_divs+native_spans+fenced_divs+bracketed_spans+definition_lists+example_lists+startnum+fancy_lists+task_lists+line_blocks+escaped_line_breaks+link_attributes+autolink_bare_uris+implicit_header_references+blank_before_header+space_in_atx_header+header_attributes+implicit_figures+fenced_code_attributes+inline_code_attributes+raw_attribute

# PDF Engine Configuration
pdf-engine: xelatex
pdf-engine-opts:
  - "-halt-on-error"
  - "-file-line-error"

# Template and Styling
# No `template:` key here on purpose - it used to point at a non-existent
# book-builder/templates/book.latex. build-book.js passes --template from
# pandoc.templates in book.config.js (digital -> templates/book-digital.latex).

# Image processing
dpi: 300

# Table of Contents
toc: true
toc-depth: 3

# Section numbering
number-sections: true

# Filters (processed in order) - Digital version with left-bar callouts
# Note: pandoc-crossref must come before citeproc.
# citeproc MUST be listed here as the last filter, NOT declared as a top-level
# `citeproc: true` key. A top-level key runs citeproc outside this ordered chain,
# which lets pandoc-crossref revert Cite elements back to literal "[@key]" text.
# That silently rendered all 28 citations raw in the digital PDF while still
# emitting a correct bibliography, so page count and file size looked unchanged.
# pandoc-defaults-print.yaml has always had this right - keep the two in sync.
filters:
  - pandoc-crossref
  - book-builder/templates/filters/minted-filter.lua
  # BEFORE the callout filter, deliberately, for the same reason as the print chain: that
  # filter turns a callout Div into a LaTeX RawBlock, and once it has, the lead-ins INSIDE
  # the callout are no longer reachable as blocks. Running first means callouts are still
  # Divs, so their contents are walked too.
  #
  # Added in v0.6.4. The digital build had none of this and was carrying five stranded
  # lead-ins that the print build had already fixed -- "This distinction matters because:"
  # at the foot of p.23, "Setting up your constellation map:" on p.60, and three more.
  - book-builder/templates/filters/keep-leadin-with-content.lua
  - book-builder/templates/filters/callout-filter-digital.lua
  - book-builder/templates/filters/link-filter.lua
  - citeproc

# Metadata
metadata-files:
  - book-builder/templates/metadata.yaml

metadata:
  # The digital measure, for keep-leadin-with-content.lua. Letter with 1in margins runs far
  # longer lines than the 6x9 print page: measured on the built PDFs, median 89 and p90 96
  # characters against print's 66 and 72. The filter defaults to print's 70, so without this
  # every one-line lead-in here would be counted as two and over-reserve a baseline. See the
  # note at BODY_CHARS in that filter.
  leadin-body-chars: 90


# Variables for template
variables:
  # Document class and options
  documentclass: book
  classoption:
    - twoside
    - openright
    - 11pt
  
  # Font sizes
  fontsize: 11pt
  
  # Book information
  title: "The Constellize Method"
  subtitle: "Building Software Systems from Knowledge"
  author: "Steve Atkinson"
  publisher: "Constellize Press"
  
  # PDF metadata
  subject: "Software Engineering Methodology"
  keywords: "Software Engineering, AI, Development, Constellize"
  
  # Layout
  linestretch: 1.2
  indent: true
  
  # Geometry (book dimensions)
  geometry: "papersize=letter,margin=1in,bindingoffset=0.2in,heightrounded"
  
  # Colors and links
  colorlinks: true
  linkcolor: "black"
  urlcolor: "blue"
  citecolor: "blue"
  toccolor: "black"
  
  # Code styling (using minted via filter)
  # listings: false  # Using minted instead
  # highlight-style: null  # Minted handles syntax highlighting
  
  # Custom styling flags
  book-style: true
  professional: true

# Output options
